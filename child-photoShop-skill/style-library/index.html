<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>风格库 · 加权混合</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-main">
      <h1>风格库 · 加权混合</h1>
      <p class="topbar-sub">从摄影馆风格库里挑几种风格、调好配比，得到一份混合后的风格画像。</p>
    </div>
    <div class="topbar-note">
      <span class="badge">静态原型</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <h2>风格库</h2>
        <p class="panel-hint">拖动滑块设定配比，权重为 0 的风格不参与混合。</p>
      </div>
      <div id="library-list" class="library"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>混合结果</h2>
        <p class="panel-hint">数值维度按权重加权平均，颜色按权重混色，分类字段取权重最高的一份。</p>
      </div>
      <div id="result-body" class="result"></div>
      <div class="actions">
        <button id="export-btn" type="button" disabled>导出 JSON</button>
        <button id="reset-btn" type="button">恢复默认配比</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer">
    <p>
      本页是<b>前端原型</b>，不接后端：风格库是内置静态数据，保存接口是占位实现（只校验、不落盘），
      只有「导出 JSON」是真的。风格画像只含影调、色彩、质感，<b>不含任何人脸或几何字段</b> ——
      加载与导出都会校验这一点。
    </p>
  </footer>

  <script src="profile-library.js"></script>
  <script src="app.js"></script>
</body>
</html>
