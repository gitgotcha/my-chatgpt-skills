name = "reliable-drive-sync"
main = "src/index.js"
compatibility_date = "2026-08-13"

[[d1_databases]]
binding = "DB"
database_name = "reliable-drive-sync"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "reliable-drive-sync-artifacts"
